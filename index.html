<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>MeydanGSM Yönetim</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
/* Yerleşim: üstte koyu marka çubuğu + dönem seçici, altında yatay sekmeler, içerik tek sütun (form üstte, liste altta). */
:root{
  --bg:#f2f6f8; --surface:#ffffff; --ink:#10212e; --muted:#5a6b78; --line:#d9e2e8; --soft:#e6f2f3;
  --accent:#0b7f8c; --accent-ink:#ffffff; --bar:#0f2b46; --bar-ink:#eef6f8; --bar-muted:#9fb6c6;
  --good:#12754a; --good-bg:#dff3e8; --bad:#bf352d; --bad-bg:#fbe3e1; --warn:#9a5b00; --warn-bg:#fcebcc;
  --display:"Bricolage Grotesque","Plus Jakarta Sans",system-ui,sans-serif;
  --body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0b141b; --surface:#121e28; --ink:#e5edf2; --muted:#93a4b1; --line:#233341; --soft:#15303a;
  --accent:#3fc1cd; --accent-ink:#04262a; --bar:#08131c; --bar-ink:#e5edf2; --bar-muted:#7f95a5;
  --good:#55d394; --good-bg:#123425; --bad:#ff8a82; --bad-bg:#3b1a18; --warn:#f1b65a; --warn-bg:#3a2a0e; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0b141b; --surface:#121e28; --ink:#e5edf2; --muted:#93a4b1; --line:#233341; --soft:#15303a;
  --accent:#3fc1cd; --accent-ink:#04262a; --bar:#08131c; --bar-ink:#e5edf2; --bar-muted:#7f95a5;
  --good:#55d394; --good-bg:#123425; --bad:#ff8a82; --bad-bg:#3b1a18; --warn:#f1b65a; --warn-bg:#3a2a0e; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0}
.login{max-width:380px;margin:40px auto;display:grid;gap:12px}
.login form{display:grid;gap:12px}
.out{background:transparent;color:var(--bar-ink);border:1px solid var(--bar-muted);border-radius:8px;padding:6px 10px;cursor:pointer}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{background:var(--bar);color:var(--bar-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font-size:20px;letter-spacing:.01em}
.brand span{color:var(--bar-muted);font-size:12px}
.period{display:flex;gap:6px;align-items:center}
.period select{background:transparent;color:var(--bar-ink);border:1px solid var(--bar-muted);border-radius:8px;padding:6px 8px}
.period option{color:#10212e;background:#fff}
.tabs{background:var(--bar);border-top:1px solid color-mix(in srgb,var(--bar-muted) 30%,transparent)}
.tabs-in{max-width:1180px;margin:0 auto;padding:0 16px;display:flex;gap:2px;overflow-x:auto}
.tabs button{background:none;border:0;color:var(--bar-muted);padding:10px 12px;cursor:pointer;white-space:nowrap;font-weight:600;border-bottom:3px solid transparent}
.tabs button[aria-selected="true"]{color:var(--bar-ink);border-bottom-color:var(--accent)}
main{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:18px 48px;display:grid;gap:18px}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 14px;font-weight:600}
.sec{display:grid;gap:10px;min-width:0;align-content:start}
.sec>h2{font-size:17px}
.sec>p{margin:0;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:2px;min-width:0}
.card .k{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.card .v{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.card .n{font-size:12px;color:var(--muted)}
.v.good{color:var(--good)} .v.bad{color:var(--bad)} .v.acc{color:var(--accent)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
form.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px 12px;align-items:end}
form.grid .wide{grid-column:span 2}
@media (max-width:420px){form.grid .wide{grid-column:auto}}
label.f{display:grid;gap:4px;font-size:12px;font-weight:600;color:var(--muted);min-width:0}
label.f input,label.f select,label.f textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 9px;color:var(--ink);font-weight:500;width:100%;min-width:0}
label.f textarea{min-height:150px;resize:vertical}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:9px 16px;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:4px 9px;font-size:12px;font-weight:600}
.btn.danger{background:var(--bad);color:var(--surface)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
td.wrap{white-space:normal;min-width:160px}
th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700}
td.r,th.r{text-align:right}
tr.tot td{font-weight:700;border-top:2px solid var(--line)}
tr.dim td{color:var(--muted)}
tr.now td{background:var(--soft)}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.mute{background:var(--soft);color:var(--muted)}
.pos{color:var(--good);font-weight:600} .neg{color:var(--bad);font-weight:600}
.empty{color:var(--muted);padding:18px 4px}
.bar{height:8px;border-radius:4px;background:var(--soft);min-width:70px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.bar.red i{background:var(--bad)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tools input{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;color:var(--ink);min-width:0;flex:1 1 180px;max-width:320px}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--body)}
.chart .g{fill:var(--good)} .chart .x{fill:var(--bad)} .chart line{stroke:var(--line)}
.legend{display:flex;gap:14px;color:var(--muted);font-size:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--bar);color:var(--bar-ink);padding:10px 16px;border-radius:10px;font-weight:600;z-index:9;max-width:90vw}
#toast.err{background:var(--bad);color:var(--surface)}
</style>

</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand"><h1 id="shopName">MeydanGSM</h1><span>Yönetim paneli</span></div>
    <div class="period">
      <select id="selAy" aria-label="Ay"></select>
      <select id="selYil" aria-label="Yıl"></select>
      <button class="out" id="btnCikis" data-act="cikis" hidden>Çıkış</button>
    </div>
  </div>
  <nav class="tabs"><div class="tabs-in" id="tabs" role="tablist"></div></nav>
</header>
<main id="main"><div class="empty">Veriler yükleniyor…</div></main>
<div id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
document.documentElement.lang='tr';
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=new Intl.NumberFormat('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2});
const TL=n=>nf.format(Math.round((n||0)*100)/100)+' ₺';
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>iso(new Date());
const fd=s=>s?`${s.slice(8,10)}.${s.slice(5,7)}.${s.slice(0,4)}`:'—';
const num=v=>{const n=parseFloat(String(v??'').replace(',','.'));return isFinite(n)?n:0};
const days=(a,b)=>Math.round((new Date(b+'T00:00')-new Date(a+'T00:00'))/864e5);
const sum=(a,f)=>a.reduce((t,x)=>t+(f(x)||0),0);
const pct=(a,b)=>b?Math.round(a/b*100):0;

const AYLAR=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const PAYS=['Nakit','Kredi Kartı (POS)','Havale / EFT','Veresiye'];
const TAHSIL=PAYS.slice(0,3);
const SERVIS_DURUM=['Bekliyor','Parça Bekliyor','Tamirde','Hazır','Teslim Edildi','İade'];
const K_ALIM='Telefon Alımı', K_SERVIS='Teknik Servis / Tamir';
const DEF={ad:'MeydanGSM',acilis:0,hedef:0,
 gelirKat:['Telefon Satışı (Sıfır)','Telefon Satışı (2. El)','Aksesuar Satışı','Kılıf / Ekran Koruyucu',K_SERVIS,'Hat / Fatura / TL Yükleme','Takas / Alım-Satım Farkı','Diğer Gelir'],
 giderKat:[K_ALIM,'Aksesuar Alımı','Yedek Parça','Kira','Personel Maaş / Avans','Elektrik / Su / İnternet','Vergi / SGK / Muhasebe','POS Komisyonu','Kargo / Nakliye','Reklam / Tabela','Yemek / Mutfak','Diğer Gider']};
const TABS=[['panel','Panel'],['islemler','İşlemler'],['stok','Stok'],['veresiye','Veresiye'],['servis','Servis'],['kasa','Kasa'],['ayarlar','Ayarlar']];
const COLS=['islemler','stok','musteriler','veresiye','servis','sayim'];
const now=new Date();
const S={tab:'panel',y:now.getFullYear(),m:now.getMonth()+1,db:null,ready:false,loaded:new Set(),
  d:{islemler:[],stok:[],musteriler:[],veresiye:[],servis:[],sayim:[]},ayar:{...DEF},edit:{},draft:{},confirm:null,q:'',tumu:false};

/* ---------- form şemaları ---------- */
const custOpts=()=>[['','Seçin…'],...S.d.musteriler.slice().sort((a,b)=>a.ad.localeCompare(b.ad,'tr')).map(m=>[m.id,m.ad])];
const F={
 islemler:[
  {k:'tarih',l:'Tarih',t:'date',req:1,def:today},
  {k:'tur',l:'Tür',t:'select',opts:()=>['Gelir','Gider'],req:1,def:()=>'Gelir'},
  {k:'kategori',l:'Kategori',t:'select',opts:v=>['',...(v.tur==='Gider'?S.ayar.giderKat:S.ayar.gelirKat)],req:1},
  {k:'aciklama',l:'Açıklama (ürün / model)',t:'text',wide:1},
  {k:'odeme',l:'Ödeme şekli',t:'select',opts:v=>v.tur==='Gider'?TAHSIL:PAYS,req:1,def:()=>'Nakit'},
  {k:'tutar',l:'Tutar (₺)',t:'num',req:1},
  {k:'imei',l:'IMEI (stoktan satışta)',t:'text',list:'imeiList',show:v=>v.tur==='Gelir'},
  {k:'maliyet',l:'Maliyet (₺, isteğe bağlı)',t:'num',show:v=>v.tur==='Gelir'},
  {k:'musteriId',l:'Veresiye müşterisi',t:'select',opts:custOpts,show:v=>v.odeme==='Veresiye',req:1},
  {k:'vade',l:'Vade tarihi',t:'date',show:v=>v.odeme==='Veresiye'},
  {k:'not',l:'Not',t:'text'}],
 stok:[
  {k:'alis',l:'Alış tarihi',t:'date',req:1,def:today},
  {k:'tur',l:'Ürün türü',t:'select',opts:()=>['Telefon (Sıfır)','Telefon (2. El)','Tablet','Akıllı Saat','Diğer'],def:()=>'Telefon (2. El)'},
  {k:'model',l:'Marka / model',t:'text',req:1,wide:1},
  {k:'imei',l:'IMEI / seri no',t:'text',req:1},
  {k:'kimden',l:'Kimden alındı',t:'text'},
  {k:'fiyat',l:'Alış fiyatı (₺)',t:'num',req:1},
  {k:'odendi',l:'Alım ödemesi gider yazılsın mı?',t:'select',opts:()=>[['','Hayır, yazma'],...TAHSIL.map(p=>[p,'Evet — '+p])],def:()=>'Nakit'}],
 musteriler:[
  {k:'ad',l:'Müşteri adı',t:'text',req:1,wide:1},
  {k:'telefon',l:'Telefon',t:'text'}],
 veresiye:[
  {k:'tarih',l:'Tarih',t:'date',req:1,def:today},
  {k:'musteriId',l:'Müşteri',t:'select',opts:custOpts,req:1},
  {k:'islem',l:'İşlem',t:'select',opts:()=>['Tahsilat','Borç'],req:1,def:()=>'Tahsilat'},
  {k:'sekil',l:'Tahsilat şekli',t:'select',opts:()=>TAHSIL,show:v=>v.islem==='Tahsilat',req:1,def:()=>'Nakit'},
  {k:'tutar',l:'Tutar (₺)',t:'num',req:1},
  {k:'vade',l:'Vade tarihi',t:'date',show:v=>v.islem==='Borç'},
  {k:'aciklama',l:'Açıklama',t:'text',wide:1}],
 servis:[
  {k:'kabul',l:'Kabul tarihi',t:'date',req:1,def:today},
  {k:'musteri',l:'Müşteri',t:'text',req:1},
  {k:'telefon',l:'Telefon',t:'text'},
  {k:'cihaz',l:'Cihaz (marka / model)',t:'text',req:1},
  {k:'imei',l:'IMEI / seri no',t:'text'},
  {k:'ariza',l:'Arıza / şikayet',t:'text',wide:1},
  {k:'islem',l:'Yapılan işlem',t:'text',wide:1},
  {k:'parca',l:'Parça maliyeti (₺)',t:'num'},
  {k:'ucret',l:'Ücret (₺)',t:'num'},
  {k:'durum',l:'Durum',t:'select',opts:()=>SERVIS_DURUM,req:1,def:()=>'Bekliyor'},
  {k:'teslim',l:'Teslim tarihi',t:'date',show:v=>v.durum==='Teslim Edildi'},
  {k:'tahsil',l:'Tahsilat (gelir yazılır)',t:'select',opts:()=>[['','Tahsil edilmedi'],...TAHSIL],show:v=>v.durum==='Teslim Edildi'},
  {k:'not',l:'Not',t:'text'}],
 sayim:[
  {k:'tarih',l:'Tarih',t:'date',req:1,def:today},
  {k:'sayilan',l:'Sayılan nakit (₺)',t:'num',req:1},
  {k:'not',l:'Not',t:'text',wide:1}]
};
const FORM_TITLE={islemler:'işlem',stok:'cihaz',musteriler:'müşteri',veresiye:'veresiye hareketi',servis:'servis kaydı',sayim:'kasa sayımı'};

function formVals(ent){
  if(S.draft[ent]) return S.draft[ent];
  const id=S.edit[ent]; const rec=id&&S.d[ent].find(r=>r.id===id);
  const v={}; for(const f of F[ent]) v[f.k]=rec?(rec[f.k]??''):(f.def?f.def():'');
  return v;
}
function formHtml(ent){
  const v=formVals(ent), ed=!!S.edit[ent];
  const fields=F[ent].filter(f=>!f.show||f.show(v)).map(f=>{
    const id=`${ent}-${f.k}`, val=v[f.k]??'';
    let inp;
    if(f.t==='select'){
      const o=f.opts(v).map(x=>Array.isArray(x)?x:[x,x||'Seçin…']);
      inp=`<select id="${id}" data-k="${f.k}">${o.map(([a,b])=>`<option value="${esc(a)}"${a===val?' selected':''}>${esc(b)}</option>`).join('')}</select>`;
    } else if(f.t==='num') inp=`<input id="${id}" data-k="${f.k}" type="number" step="0.01" min="0" inputmode="decimal" value="${esc(val)}">`;
    else inp=`<input id="${id}" data-k="${f.k}" type="${f.t}" value="${esc(val)}"${f.list?` list="${f.list}" autocomplete="off"`:''}>`;
    return `<label class="f${f.wide?' wide':''}" for="${id}">${esc(f.l)}${f.req?' *':''}${inp}</label>`;
  }).join('');
  return `<form class="grid" data-ent="${ent}" novalidate>${fields}
    <div class="acts"><button class="btn" type="submit">${ed?'Güncelle':'Kaydet'}</button>${ed?`<button class="btn ghost" type="button" data-act="cancel" data-ent="${ent}">Vazgeç</button>`:''}</div></form>`;
}
function readForm(form){
  const ent=form.dataset.ent, v={...formVals(ent)};
  form.querySelectorAll('[data-k]').forEach(el=>{v[el.dataset.k]=el.value.trim()});
  return v;
}
function mountForm(ent){
  const box=$(`#form-${ent}`); if(!box) return;
  box.innerHTML=`<h3 style="font-size:14px;margin-bottom:10px">${S.edit[ent]?'Düzenle: ':'Yeni '}${FORM_TITLE[ent]}</h3>`+formHtml(ent);
}

/* ---------- hesaplar ---------- */
function calc(){
  const D=S.d, A=S.ayar, ym=`${S.y}-${pad(S.m)}`, t=today();
  const stokImei=new Map(D.stok.map(s=>[s.imei,s]));
  const cost=i=>i.tur!=='Gelir'?null:(num(i.maliyet)>0?num(i.maliyet):(i.imei&&stokImei.has(i.imei)?num(stokImei.get(i.imei).fiyat):null));
  const kar=i=>{const c=cost(i);return c==null?null:num(i.tutar)-c};
  const satis=new Map(); for(const i of D.islemler) if(i.tur==='Gelir'&&i.imei&&!satis.has(i.imei)) satis.set(i.imei,i);
  const gel=(a)=>sum(a.filter(i=>i.tur==='Gelir'),i=>num(i.tutar)), gid=(a)=>sum(a.filter(i=>i.tur==='Gider'),i=>num(i.tutar));
  const inM=(key)=>D.islemler.filter(i=>(i.tarih||'').startsWith(key));
  const ay=inM(ym), pm=S.m===1?`${S.y-1}-12`:`${S.y}-${pad(S.m-1)}`, onceki=inM(pm), bugun=D.islemler.filter(i=>i.tarih===t);
  const nakitDelta=(pred)=>sum(D.islemler.filter(i=>i.odeme==='Nakit'&&pred(i.tarih||'')),i=>i.tur==='Gelir'?num(i.tutar):-num(i.tutar))
     +sum(D.veresiye.filter(v=>v.islem==='Tahsilat'&&v.sekil==='Nakit'&&pred(v.tarih||'')),v=>num(v.tutar));
  const kasa=num(A.acilis)+nakitDelta(()=>true);
  const kasaAt=d=>num(A.acilis)+nakitDelta(x=>x<=d);
  const cust=D.musteriler.map(m=>{
    const h=D.veresiye.filter(v=>v.musteriId===m.id);
    const borc=sum(h.filter(v=>v.islem==='Borç'),v=>num(v.tutar)), tah=sum(h.filter(v=>v.islem==='Tahsilat'),v=>num(v.tutar));
    const kalan=borc-tah, gecik=h.some(v=>v.islem==='Borç'&&v.vade&&v.vade<t);
    return {...m,borc,tah,kalan,son:h.map(v=>v.tarih).sort().pop(),durum:kalan<=0.005?(h.length?'Kapandı':'Hareket yok'):(gecik?'Vadesi geçti':'Açık')};
  });
  const stok=D.stok.map(s=>{const x=satis.get(s.imei);return {...s,sat:x,durum:x?'Satıldı':'Stokta',kar:x?num(x.tutar)-num(s.fiyat):null,gun:days(s.alis,x?x.tarih:t)}});
  const sayimSon=D.sayim.slice().sort((a,b)=>a.tarih.localeCompare(b.tarih)).pop();
  return {ym,t,cost,kar,gel,gid,ay,onceki,bugun,kasa,kasaAt,cust,stok,sayimSon,inM};
}

/* ---------- görünüm yardımcıları ---------- */
const card=(k,v,n='',cls='')=>`<div class="card"><span class="k">${k}</span><span class="v ${cls}">${v}</span><span class="n">${n}</span></div>`;
function table(cols,rows,emptyMsg,rowCls){
  if(!rows.length) return `<div class="empty">${emptyMsg}</div>`;
  return `<div class="scroll"><table><thead><tr>${cols.map(c=>`<th class="${c.c||''}">${c.h}</th>`).join('')}</tr></thead><tbody>${
    rows.map(r=>`<tr class="${rowCls?rowCls(r):''}">${cols.map(c=>`<td class="${c.c||''}">${c.v(r)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function acts(ent,r,locked){
  if(locked) return `<span class="pill mute">${locked}</span>`;
  const key=ent+':'+r.id;

}

  </div>
  <section class="panel sec"><h2>${S.y} aylık özet</h2>${svg}

  const msg=S.msg?`<div class="banner">${esc(S.msg)}</div>`:'';
  if(S.auth==='cfg'){main.innerHTML=msg;return}
  if(S.auth==='out'){main.innerHTML=`<section class="panel login"><h2>Giriş</h2>${msg}<form id="loginForm" novalidate>
    <label class="f" for="lg-email">E-posta<input id="lg-email" type="email" autocomplete="username"></label>
    <label class="f" for="lg-sifre">Şifre<input id="lg-sifre" type="password" autocomplete="current-password"></label>
    <button class="btn" type="submit">Giriş yap</button></form></section>`;return}
  if(S.msg){main.innerHTML=msg;return}
  if(!S.db||!S.ready){main.innerHTML='<div class="empty">Veriler yükleniyor…</div>';return}
  const saved={}, act=document.activeElement, actId=act&&act.id, pos=act&&act.selectionStart;
  if(keepForms) (TAB_FORMS[S.tab]||[]).forEach(e=>{const f=$(`form[data-ent="${e}"]`); if(f) saved[e]=readForm(f)});
  const ayar=keepForms&&S.tab==='ayarlar'&&$('#ayarForm')?[...$('#ayarForm').querySelectorAll('[id]')].map(el=>[el.id,el.value]):null;
  main.innerHTML=VIEWS[S.tab](calc());
  (TAB_FORMS[S.tab]||[]).forEach(e=>{ if(saved[e]) S.draft[e]=saved[e]; mountForm(e); });
  if(ayar) ayar.forEach(([id,v])=>{const el=document.getElementById(id); if(el) el.value=v});
  if(keepForms&&actId){const el=document.getElementById(actId); if(el){el.focus(); try{if(pos!=null&&el.setSelectionRange&&el.type!=='number'&&el.type!=='date') el.setSelectionRange(pos,pos)}catch(e){}}}
}
function toast(msg,err){const t=$('#toast');t.textContent=msg;t.className=err?'err':'';t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,err?5000:2200)}
const fail=e=>toast(e&&e.code==='quota_exceeded'?'Depolama sınırı doldu; eski kayıtları silin.':'Kaydedilemedi. Yazma yetkiniz olmayabilir ya da bağlantı kesildi.',1);

/* ---------- kaydetme ---------- */
const col=n=>S.db.collection(n);
function clean(ent,v){const o={};for(const f of F[ent]){if(f.show&&!f.show(v))continue;const x=v[f.k];o[f.k]=f.t==='num'?(x===''||x==null?null:num(x)):(x??'')}return o}
async function save(ent,v){
  for(const f of F[ent]){ if(f.show&&!f.show(v))continue; if(f.req&&(v[f.k]===''||v[f.k]==null||(f.t==='num'&&num(v[f.k])<=0))) return toast(`“${f.l}” alanı gerekli.`,1); }
  const o=clean(ent,v); let id=S.edit[ent];
  const old=id&&S.d[ent].find(r=>r.id===id);
  if(ent==='sayim') id=o.tarih;
  if(ent==='stok'&&S.d.stok.some(s=>s.imei===o.imei&&s.id!==id)) return toast('Bu IMEI stokta zaten kayıtlı.',1);
  if(ent==='servis'){o.no=old?.no||Math.max(0,...S.d.servis.map(s=>s.no||0))+1; if(o.durum==='Teslim Edildi'&&!o.teslim)o.teslim=today()}
  if(old?.ts) o.ts=old.ts; else o.ts=Date.now();
  if(old?.kaynak){o.kaynak=old.kaynak}
  const ref=id?col(ent).doc(id):col(ent).doc(); id=ref.id;
  try{
    await ref.set(o);
    if(ent==='islemler'){
      const l=col('veresiye').doc('i_'+id);
      if(o.odeme==='Veresiye'&&o.tur==='Gelir') await l.set({tarih:o.tarih,musteriId:o.musteriId,islem:'Borç',tutar:o.tutar,vade:o.vade||'',aciklama:o.aciklama||o.kategori,islemId:id,ts:o.ts});
      else if(old?.odeme==='Veresiye') await l.delete();
    }
    if(ent==='stok'){
      const l=col('islemler').doc('s_'+id);
      if(o.odendi) await l.set({tarih:o.alis,tur:'Gider',kategori:K_ALIM,aciklama:`${o.model} alımı`,odeme:o.odendi,tutar:o.fiyat,not:o.kimden||'',kaynak:'stok',ts:o.ts});
      else if(old?.odendi) await l.delete();
    }
    if(ent==='servis'){
      const l=col('islemler').doc('v_'+id), on=o.durum==='Teslim Edildi'&&o.tahsil&&num(o.ucret)>0;
      if(on) await l.set({tarih:o.teslim,tur:'Gelir',kategori:K_SERVIS,aciklama:`Servis S-${String(o.no).padStart(4,'0')} · ${o.cihaz}`,odeme:o.tahsil,tutar:o.ucret,maliyet:o.parca||null,not:o.musteri,kaynak:'servis',ts:o.ts});
      else if(old&&old.durum==='Teslim Edildi'&&old.tahsil) await l.delete();
    }
    delete S.edit[ent]; delete S.draft[ent]; toast('Kaydedildi'); render();
  }catch(e){fail(e)}
}
async function remove(ent,id){
  if(ent==='musteriler'&&S.d.veresiye.some(v=>v.musteriId===id)) return toast('Bu müşterinin hareketleri var; önce onları silin.',1);
  try{
    await col(ent).doc(id).delete();
    if(ent==='islemler') await col('veresiye').doc('i_'+id).delete();
    if(ent==='stok') await col('islemler').doc('s_'+id).delete();
    if(ent==='servis') await col('islemler').doc('v_'+id).delete();
    if(S.edit[ent]===id){delete S.edit[ent];delete S.draft[ent]}
    toast('Silindi');
  }catch(e){fail(e)}
  S.confirm=null; render(true);
}

/* ---------- olaylar ---------- */
document.addEventListener('click',e=>{
  const tb=e.target.closest('[data-tab]'); if(tb){S.tab=tb.dataset.tab;S.confirm=null;try{history.replaceState(null,'','#'+S.tab)}catch(_){ }render();return}
  const b=e.target.closest('[data-act]'); if(!b) return;
  const {act,ent,id}=b.dataset;
  if(act==='cikis'){ sb.auth.signOut().finally(()=>location.reload()); return }
  if(act==='del'){S.confirm=ent+':'+id;render(true)}
  else if(act==='delno'){S.confirm=null;render(true)}
  else if(act==='delyes') remove(ent,id);
  else if(act==='edit'){S.edit[ent]=id;delete S.draft[ent];render();$(`#form-${ent}`)?.scrollIntoView({behavior:'smooth',block:'start'})}
  else if(act==='cancel'){delete S.edit[ent];delete S.draft[ent];render()}
  else if(act==='tumu'){S.tumu=!S.tumu;render(true)}
});
document.addEventListener('submit',e=>{
  e.preventDefault(); const f=e.target;
  if(f.id==='loginForm'){ girisYap($('#lg-email').value.trim(),$('#lg-sifre').value); return }
  if(f.id==='ayarForm'){
    const lines=id=>$(id).value.split('\n').map(s=>s.trim()).filter(Boolean);
    const a={ad:$('#ay-ad').value.trim()||'MeydanGSM',acilis:num($('#ay-acilis').value),hedef:num($('#ay-hedef').value),gelirKat:lines('#ay-gelir'),giderKat:lines('#ay-gider')};
    if(!a.gelirKat.length||!a.giderKat.length) return toast('En az bir gelir ve bir gider kategorisi gerekli.',1);
    S.db.doc('ayarlar/genel').set(a).then(()=>toast('Ayarlar kaydedildi')).catch(fail); return;
  }
  if(f.dataset.ent) save(f.dataset.ent,readForm(f));
});
document.addEventListener('change',e=>{
  if(e.target.id==='selAy'||e.target.id==='selYil'){S.m=+$('#selAy').value;S.y=+$('#selYil').value;render(true);return}
  const f=e.target.closest('form[data-ent]');
  if(f&&e.target.tagName==='SELECT'){const ent=f.dataset.ent;S.draft[ent]=readForm(f);mountForm(ent);document.getElementById(e.target.id)?.focus()}
});
document.addEventListener('input',e=>{ if(e.target.id==='araIslem'){S.q=e.target.value;render(true)} });

/* ---------- başlangıç ---------- */
$('#selAy').innerHTML=AYLAR.map((a,i)=>`<option value="${i+1}"${i+1===S.m?' selected':''}>${a}</option>`).join('');
$('#selYil').innerHTML=Array.from({length:7},(_,i)=>S.y-4+i).map(y=>`<option${y===S.y?' selected':''}>${y}</option>`).join('');
const h=location.hash.slice(1); if(VIEWS[h]) S.tab=h;
/* ---------- Supabase bağlantısı ---------- */
const CFG=window.MEYDAN_CONFIG||{}; let sb=null, basladi=false;
S.auth='load'; S.msg='';
function makeDb(sb){
  const cache={}, subs=[]; let timer=null;
  const snapDoc=(c,id)=>({id,exists:!!(cache[c]&&cache[c][id]),data:()=>cache[c]&&cache[c][id]});
  const notify=()=>subs.forEach(f=>f());
  async function load(){
    let from=0, all=[];
    for(;;){
      const {data,error}=await sb.from('kayitlar').select('koleksiyon,id,veri').order('koleksiyon').order('id').range(from,from+999);
      if(error) throw error; all=all.concat(data); if(data.length<1000) break; from+=1000;
    }
    for(const k in cache) delete cache[k];
    for(const r of all)(cache[r.koleksiyon]??={})[r.id]=r.veri;
    notify();
  }
  const soon=()=>{clearTimeout(timer);timer=setTimeout(()=>load().catch(()=>{}),400)};
  const docRef=(c,id)=>({id,
    set:async o=>{const {error}=await sb.from('kayitlar').upsert({koleksiyon:c,id,veri:o,guncelleme:new Date().toISOString()},{onConflict:'koleksiyon,id'}); if(error) throw error; (cache[c]??={})[id]=o; notify()},
    delete:async()=>{const {error}=await sb.from('kayitlar').delete().eq('koleksiyon',c).eq('id',id); if(error) throw error; if(cache[c]) delete cache[c][id]; notify()},
    onSnapshot:f=>{subs.push(()=>f(snapDoc(c,id)))}});
  return {load,soon,
    collection:c=>({doc:id=>docRef(c,id||crypto.randomUUID()),onSnapshot:f=>{subs.push(()=>f({docs:Object.keys(cache[c]||{}).map(id=>snapDoc(c,id))}))}}),
    doc:p=>{const [c,id]=p.split('/');return docRef(c,id)}};
}
async function baslat(){
  if(basladi) return; basladi=true; S.auth='in'; S.msg=''; render();
  try{
    const {data,error}=await sb.from('yetkili').select('email').limit(1);
    if(error) throw error;
    if(!data.length){S.msg='Bu hesap panel için yetkili değil. Yetkili e-postayla giriş yapın.';S.db=null;render();return}
    const db=makeDb(sb); S.db=db;
    const done=k=>{S.loaded.add(k); if(S.loaded.size===COLS.length+1&&!S.ready){S.ready=true;render()} else if(S.ready) render(true)};
    for(const c of COLS) db.collection(c).onSnapshot(s=>{S.d[c]=s.docs.map(x=>({id:x.id,...x.data()}));done(c)});
    db.doc('ayarlar/genel').onSnapshot(s=>{S.ayar={...DEF,...(s.exists?s.data():{})};done('ayar')});
    await db.load();
    sb.channel('kayitlar').on('postgres_changes',{event:'*',schema:'public',table:'kayitlar'},db.soon).subscribe();
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)db.soon()});
  }catch(e){S.msg='Veriler okunamadı. İnternet bağlantınızı ve veritabanı kurulumunu kontrol edin.';S.db=null;render()}
}
async function girisYap(email,sifre){
  if(!email||!sifre){S.msg='E-posta ve şifre gerekli.';render();return}
  const {error}=await sb.auth.signInWithPassword({email,password:sifre});
  if(error){S.msg='Giriş yapılamadı: e-posta ya da şifre hatalı.';render();return}
  baslat();
}
(async()=>{
  if(!window.supabase||!CFG.url||!CFG.anonKey||CFG.url.includes('PROJE-KODU')){S.auth='cfg';S.msg='Kurulum tamamlanmamış: config.js dosyasına Supabase adresini ve anon anahtarını yazın.';render();return}
  sb=window.supabase.createClient(CFG.url,CFG.anonKey);
  const {data}=await sb.auth.getSession();
  if(data&&data.session) baslat(); else {S.auth='out';render()}
})();
</script>
